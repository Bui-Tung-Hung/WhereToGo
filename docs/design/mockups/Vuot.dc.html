<helmet>

<style>

.wtg.dark{--bg:#141311;--surface:#1E1C19;--surface-2:#2A2723;--border:#3A3631;--border-strong:#7D7466;--text:#F2EDE3;--muted:#B3AB9C;--accent:#E58A66;--accent-pressed:#CF7652;--on-accent:#1C1210;--accent-text:#F09D7B;--accent-soft:#3B2720;--success:#86CB9A;--success-bg:#1F3326;--warning:#E9B65E;--warning-bg:#3A2E17;--danger:#F49283;--danger-bg:#3E211D;--on-danger:#1C1210;--focus:#93B6F2;--inverse-bg:#F2EDE3;--inverse-text:#1C1917;--inverse-action:#96401F;--scrim:rgba(0,0,0,.60);--photo-edge:rgba(255,255,255,.06);--pill:rgba(30,28,25,.92);--dock:rgba(30,28,25,.96);--e1:none;--e2:0 8px 24px -8px rgba(0,0,0,.70);--g-fill:#131314;--g-stroke:#8E918F;--g-text:#E3E3E3;--ph-1:#4A4033;--ph-2:#463E37;--ph-3:#3D4436;--ph-4:#4D3A31;--ph-5:#3B4145;--ph-6:#48412F;--ph-icon:rgba(255,255,255,.30);color-scheme:dark}

.t-display{font-family:var(--serif);font-size:36px;line-height:46px;font-weight:600;letter-spacing:-0.01em;margin:0}
.t-h1{font-family:var(--serif);font-size:28px;line-height:36px;font-weight:600;margin:0}

.t-story{font-family:var(--serif);font-size:18px;line-height:28px;font-weight:400;margin:0}
.t-title{font-size:17px;line-height:24px;font-weight:600;margin:0}
.t-body{font-size:16px;line-height:24px;font-weight:400;margin:0}

    <a href="TaiKhoan.dc.html" aria-label="Tài khoản" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 999px">

    <p class="t-body-sm muted">Quán ăn · còn 14 thẻ ·</p>

  <!-- card stack -->

    <!-- front card, mid-drag to the right -->
    <article aria-label="Phở Thìn Lò Đúc" style="position: absolute; left: 0; right: 0; top: 24px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--e2); overflow: hidden; transform: translateX(24px) rotate(6deg); transform-origin: 50% 50%">
      <div role="img" aria-label="Ảnh minh hoạ: Phở Thìn Lò Đúc" style="width: 100%; aspect-ratio: 1 / 1; background: var(--ph-6); box-shadow: inset 0 0 0 1px var(--photo-edge); display: flex; align-items: center; justify-content: center; color: var(--ph-icon)"><svg width="40" height="40" viewBox="0 0 512 512" aria-hidden="true" style="display: block; flex: none"><rect width="416" height="352" x="48" y="80" rx="48" ry="48" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-width="32px"></rect><circle cx="336" cy="176" r="32" fill="none" stroke="currentColor" stroke-miterlimit="10" stroke-width="32px"></circle><path d="m304 335.79-90.66-90.49a32 32 0 0 0-43.87-1.3L48 352M224 432l123.34-123.34a32 32 0 0 1 43.11-2L464 368" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="32px"></path></svg></div>

        </div>

        <p class="t-body-sm muted">60.000–80.000 ₫ · 13 Lò Đúc</p>
      </div>
    </article>
  </div>

  <!-- action row + first-run hint -->
  <div style="flex: none; padding: 12px 16px 34px; display: flex; flex-direction: column; align-items: center; gap: 8px">
    <div style="width: 100%; display: flex; align-items: flex-start; justify-content: space-between; padding: 0 8px">

      <button type="button" aria-label="Hoàn tác" style="margin-top: 10px; width: 44px; height: 44px; padding: 0; border: 0; border-radius: 999px; background: var(--surface-2); color: var(--text); display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 512 512" aria-hidden="true" style="display: block; flex: none"><path d="M240 424v-96c116.4 0 159.39 33.76 208 96 0-119.23-39.57-240-208-240V88L64 256Z" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-width="32px"></path></svg></button>

      <button type="button" aria-label="Bỏ qua" style="width: 64px; padding: 0; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 4px">
        <span style="width: 64px; height: 64px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border-strong); box-shadow: var(--e1); color: var(--text); display: flex; align-items: center; justify-content: center"><svg width="28" height="28" viewBox="0 0 512 512" aria-hidden="true" style="display: block; flex: none"><path d="M368 368 144 144M368 144 144 368" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="32px"></path></svg></span>

        <span class="t-micro" style="color: var(--accent-text)">Hot</span>
      </button>

      <button type="button" aria-label="Thông tin" style="margin-top: 10px; width: 44px; height: 44px; padding: 0; border: 0; border-radius: 999px; background: var(--surface-2); color: var(--text); display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 512 512" aria-hidden="true" style="display: block; flex: none"><path d="M248 64C146.39 64 64 146.39 64 248s82.39 184 184 184 184-82.39 184-184S349.61 64 248 64Z" fill="none" stroke="currentColor" stroke-miterlimit="10" stroke-width="32px"></path><path d="M220 220h32v116" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="32px"></path><path d="M208 340h88" fill="none" stroke="currentColor" stroke-linecap="round" stroke-miterlimit="10" stroke-width="32px"></path><path fill="currentColor" d="M248 130a26 26 0 1 0 26 26 26 26 0 0 0-26-26"></path></svg></button>

  </div>
</div>
