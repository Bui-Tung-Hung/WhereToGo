</head>
<body>
<x-dc>
<helmet>

<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600&amp;family=Newsreader:wght@400;600&amp;family=Roboto:wght@500&amp;display=swap" rel="stylesheet">
<style>
/* ===== WTG TOKENS v1 — identical in every artboard, do not edit ===== */
body{margin:0}
.wtg{--bg:#F5F2E9;--surface:#FBF9F4;--surface-2:#EDE8DC;--border:#E2DBCC;--border-strong:#8A8072;--text:#1C1917;--muted:#5C554B;--accent:#A8482A;--accent-pressed:#8F3D23;--on-accent:#FFFFFF;--accent-text:#96401F;--accent-soft:#F4E1D7;--success:#2D6E45;--success-bg:#E2EEE2;--warning:#8A5600;--warning-bg:#F5E6C8;--danger:#B3261E;--danger-bg:#F8E0DA;--on-danger:#FFFFFF;--focus:#2F5DA8;--inverse-bg:#1C1917;--inverse-text:#F5F2E9;--inverse-action:#F09D7B;--scrim:rgba(28,25,23,.45);--photo-edge:rgba(28,25,23,.08);--pill:rgba(251,249,244,.92);--dock:rgba(251,249,244,.96);--e1:0 1px 2px rgba(28,25,23,.06);--e2:0 8px 24px -8px rgba(28,25,23,.20);--g-fill:#FFFFFF;--g-stroke:#747775;--g-text:#1F1F1F;--ph-1:#D9C7A7;--ph-2:#C9B8A6;--ph-3:#B9C3AA;--ph-4:#D8B8A4;--ph-5:#C2C9CC;--ph-6:#D3C4A0;--ph-icon:rgba(28,25,23,.32);--viewer-bg:#0C0A09;--sans:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;--serif:'Newsreader',Georgia,'Times New Roman',serif;color-scheme:light;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:24px;-webkit-font-smoothing:antialiased}
.wtg.dark{--bg:#141311;--surface:#1E1C19;--surface-2:#2A2723;--border:#3A3631;--border-strong:#7D7466;--text:#F2EDE3;--muted:#B3AB9C;--accent:#E58A66;--accent-pressed:#CF7652;--on-accent:#1C1210;--accent-text:#F09D7B;--accent-soft:#3B2720;--success:#86CB9A;--success-bg:#1F3326;--warning:#E9B65E;--warning-bg:#3A2E17;--danger:#F49283;--danger-bg:#3E211D;--on-danger:#1C1210;--focus:#93B6F2;--inverse-bg:#F2EDE3;--inverse-text:#1C1917;--inverse-action:#96401F;--scrim:rgba(0,0,0,.60);--photo-edge:rgba(255,255,255,.06);--pill:rgba(30,28,25,.92);--dock:rgba(30,28,25,.96);--e1:none;--e2:0 8px 24px -8px rgba(0,0,0,.70);--g-fill:#131314;--g-stroke:#8E918F;--g-text:#E3E3E3;--ph-1:#4A4033;--ph-2:#463E37;--ph-3:#3D4436;--ph-4:#4D3A31;--ph-5:#3B4145;--ph-6:#48412F;--ph-icon:rgba(255,255,255,.30);color-scheme:dark}
.wtg *{box-sizing:border-box}
.wtg button,.wtg input,.wtg select,.wtg textarea{font:inherit;color:inherit}
.wtg a{color:var(--accent-text);text-decoration:none}
.wtg a:hover{color:var(--accent-text)}
.wtg p a,.wtg li a{text-decoration:underline;text-underline-offset:3px}
.wtg :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.t-display{font-family:var(--serif);font-size:36px;line-height:46px;font-weight:600;letter-spacing:-0.01em;margin:0}
.t-h1{font-family:var(--serif);font-size:28px;line-height:36px;font-weight:600;margin:0}
.t-h2{font-family:var(--serif);font-size:22px;line-height:30px;font-weight:600;margin:0}
.t-name{font-family:var(--serif);font-size:17px;line-height:22px;font-weight:600;margin:0}
.t-name-lg{font-family:var(--serif);font-size:24px;line-height:32px;font-weight:600;margin:0}
.t-numeral{font-family:var(--serif);font-size:28px;line-height:36px;font-weight:600}
.t-story{font-family:var(--serif);font-size:18px;line-height:28px;font-weight:400;margin:0}
.t-title{font-size:17px;line-height:24px;font-weight:600;margin:0}
.t-body{font-size:16px;line-height:24px;font-weight:400;margin:0}
.t-btn{font-size:16px;line-height:24px;font-weight:600}
.t-body-sm{font-size:15px;line-height:22px;font-weight:400;margin:0}
.t-label{font-size:14px;line-height:20px;font-weight:600;margin:0}
.t-caption{font-size:13px;line-height:18px;font-weight:400;margin:0}
.t-micro{font-size:12px;line-height:16px;font-weight:600;white-space:nowrap}
.muted{color:var(--muted)}
/* ===== end WTG TOKENS v1 ===== */
</style>
</helmet>
<div class="wtg {{mode}}" style="width: 390px; height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column; background: var(--bg)">
  <!-- top safe area: leave empty -->
  <div style="height: 47px; flex: none"></div>

  <!-- back + stepper (step 3 of 4) -->
  <header style="height: 56px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 16px 0 8px">
    <a href="BatDau1DongY.dc.html" aria-label="Quay lại" style="width: 44px; height: 44px; flex: none; display: flex; align-items: center; justify-content: center; border-radius: 999px; color: var(--text)"><svg width="24" height="24" viewBox="0 0 512 512" aria-hidden="true" style="display: block; flex: none"><path d="M328 112 184 256l144 144" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="48px"></path></svg></a>
    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px">
      <p class="t-caption muted">Bước 3/4</p>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px"><span style="height: 4px; border-radius: 999px; background: var(--accent)"></span><span style="height: 4px; border-radius: 999px; background: var(--accent)"></span><span style="height: 4px; border-radius: 999px; background: var(--accent)"></span><span style="height: 4px; border-radius: 999px; background: var(--border-strong)"></span></div>
    </div>
  </header>

  <main style="flex: 1; min-height: 0; overflow-y: auto; padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 20px">

    <div style="display: flex; flex-direction: column; gap: 12px">
      <h1 class="t-display">Bạn hay lưu những nơi nào?</h1>
      <p class="t-body-sm"><strong style="font-weight: 600">Nhóm</strong> là các ngăn lớn trong kho — mỗi nhóm thành một thẻ trên Trang chủ, và mỗi địa điểm thuộc ít nhất một nhóm. <strong style="font-weight: 600">Nhãn</strong> là ghi chú nhỏ để tìm nhanh, như “Hẹn hò”.</p>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">

      <label style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 16px; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--e1); cursor: pointer">
        <input type="checkbox" checked="{{n1}}" onChange="{{toggle1}}" style="width: 24px; height: 24px; margin: 0; flex: none; accent-color: var(--accent)">
        <span style="width: 40px; height: 40px; flex: none; border-radius: 999px; background: var(--surface-2); color: var(--text); display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 512 512" aria-hidden="true" style="display: block; flex: none"><path d="m57.49 47.74 368.43 368.43a37.28 37.28 0 0 1 0 52.72 37.29 37.29 0 0 1-52.72 0l-90-91.55a32 32 0 0 1-9.2-22.43v-5.53a32 32 0 0 0-9.52-22.78l-11.62-10.73a32 32 0 0 0-29.8-7.44 48.53 48.53 0 0 1-46.56-12.63l-85.43-85.44C40.39 159.68 21.74 83.15 57.49 47.74Z" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-width="32px"></path><path d="m400 32-77.25 77.25A64 64 0 0 0 304 154.51v14.86a16 16 0 0 1-4.69 11.32L288 192M320 224l11.31-11.31a16 16 0 0 1 11.32-4.69h14.86a64 64 0 0 0 45.26-18.75L480 112M440 72l-80 80M200 368l-99.72 100.28a40 40 0 0 1-56.56 0h0a40 40 0 0 1 0-56.56L128 328" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="32px"></path></svg></span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span class="t-name">Quán ăn</span><span class="t-caption muted">Chán cơm thì ăn gì?</span></span>
      </label>

      <label style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 16px; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--e1); cursor: pointer">
        <input type="checkbox" checked="{{n2}}" onChange="{{toggle2}}" style="width: 24px; height: 24px; margin: 0; flex: none; accent-color: var(--accent)">
        <span style="width: 40px; height: 40px; flex: none; border-radius: 999px; background: var(--surface-2); color: var(--text); display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 512 512" aria-hidden="true" style="display: block; flex: none"><path d="M368 80h64a16 16 0 0 1 16 16v34a46 46 0 0 1-46 46h-34M96 80h272v192a80 80 0 0 1-80 80H176a80 80 0 0 1-80-80zM64 416h336" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="32px"></path></svg></span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span class="t-name">Quán uống</span><span class="t-caption muted">Chán nước thì uống gì?</span></span>
      </label>

      <label style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 16px; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--e1); cursor: pointer">
        <input type="checkbox" checked="{{n3}}" onChange="{{toggle3}}" style="width: 24px; height: 24px; margin: 0; flex: none; accent-color: var(--accent)">
        <span style="width: 40px; height: 40px; flex: none; border-radius: 999px; background: var(--surface-2); color: var(--text); display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 512 512" aria-hidden="true" style="display: block; flex: none"><path d="M467.51 248.83c-18.4-83.18-45.69-136.24-89.43-149.17A91.5 91.5 0 0 0 352 96c-26.89 0-48.11 16-96 16s-69.15-16-96-16a99 99 0 0 0-27.2 3.66C89 112.59 61.94 165.7 43.33 248.83c-19 84.91-15.56 152 21.58 164.88 26 9 49.25-9.61 71.27-37 25-31.2 55.79-40.8 119.82-40.8s93.62 9.6 118.66 40.8c22 27.41 46.11 45.79 71.42 37.16 41.02-14.01 40.44-79.13 21.43-165.04Z" fill="none" stroke="currentColor" stroke-miterlimit="10" stroke-width="32px"></path><circle cx="292" cy="224" r="20"></circle><path d="M336 288a20 20 0 1 1 20-19.95A20 20 0 0 1 336 288"></path><circle cx="336" cy="180" r="20"></circle><circle cx="380" cy="224" r="20"></circle><path d="M160 176v96M208 224h-96" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="32px"></path></svg></span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span class="t-name">Chỗ chơi</span><span class="t-caption muted">Chán ở nhà thì đi đâu?</span></span>
      </label>

      <label style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 16px; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--e1); cursor: pointer">
        <input type="checkbox" checked="{{n4}}" onChange="{{toggle4}}" style="width: 24px; height: 24px; margin: 0; flex: none; accent-color: var(--accent)">
        <span style="width: 40px; height: 40px; flex: none; border-radius: 999px; background: var(--surface-2); color: var(--text); display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 512 512" aria-hidden="true" style="display: block; flex: none"><path d="M407.72 224c-3.4 0-14.79.1-18 .3l-64.9 1.7a1.83 1.83 0 0 1-1.69-.9L193.55 67.56a9 9 0 0 0-6.66-3.56H160l73 161a2.35 2.35 0 0 1-2.26 3.35l-121.69 1.8a8.06 8.06 0 0 1-6.6-3.1l-37-45c-3-3.9-8.62-6-13.51-6H33.08c-1.29 0-1.1 1.21-.75 2.43l19.84 71.42a16.3 16.3 0 0 1 0 11.9L32.31 333c-.59 1.95-.52 3 1.77 3H52c8.14 0 9.25-1.06 13.41-6.3l37.7-45.7a8.19 8.19 0 0 1 6.6-3.1l120.68 2.7a2.7 2.7 0 0 1 2.43 3.74L160 448h26.64a9 9 0 0 0 6.65-3.55L323.14 287c.39-.6 2-.9 2.69-.9l63.9 1.7c3.3.2 14.59.3 18 .3C452 288.1 480 275.93 480 256s-27.88-32-72.28-32" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="32px"></path></svg></span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span class="t-name">Du lịch</span><span class="t-caption muted">Cuối tuần trốn đi đâu?</span></span>
      </label>

      <button type="button" class="t-btn" style="width: 100%; height: 48px; padding: 0 16px; border-radius: 16px; background: transparent; color: var(--accent-text); border: 1px dashed var(--border-strong); display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="20" height="20" viewBox="0 0 512 512" aria-hidden="true" style="display: block; flex: none"><path d="M256 112v288M400 256H112" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="32px"></path></svg>Thêm nhóm khác</button>

    </div>

  </main>

  <!-- sticky bottom area: its background runs into the bottom safe area -->
  <div style="flex: none; background: var(--surface); border-top: 1px solid var(--border); padding: 12px 16px 34px; display: flex; flex-direction: column; gap: 8px">
    <sc-if value="{{hasAny}}" hint-placeholder-val="{{ true }}">
      <a href="HomeMoi.dc.html" class="t-btn" style="width: 100%; height: 48px; padding: 0 20px; border-radius: 12px; background: var(--accent); color: var(--on-accent); display: inline-flex; align-items: center; justify-content: center; gap: 8px">{{ctaLabel}}</a>
    </sc-if>
    <sc-if value="{{noneSelected}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
        <button type="button" disabled class="t-btn" style="width: 100%; height: 48px; padding: 0 20px; border-radius: 12px; background: var(--surface-2); color: var(--muted); border: 0; display: inline-flex; align-items: center; justify-content: center; gap: 8px">Tạo nhóm</button>
        <p class="t-caption" style="color: var(--danger); display: flex; align-items: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 512 512" aria-hidden="true" style="display: block; flex: none"><path d="M448 256c0-106-86-192-192-192S64 150 64 256s86 192 192 192 192-86 192-192Z" fill="none" stroke="currentColor" stroke-miterlimit="10" stroke-width="32px"></path><path d="M250.26 166.05 256 288l5.73-121.95a5.74 5.74 0 0 0-5.79-6h0a5.74 5.74 0 0 0-5.68 6" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="32px"></path><path d="M256 367.91a20 20 0 1 1 20-20 20 20 0 0 1-20 20"></path></svg>Chọn ít nhất một nhóm.</p>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"Giao diện"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const s = this.state || {};
    const n1 = s.n1 ?? true;
    const n2 = s.n2 ?? true;
    const n3 = s.n3 ?? true;
    const n4 = s.n4 ?? true;
    const count = (n1 ? 1 : 0) + (n2 ? 1 : 0) + (n3 ? 1 : 0) + (n4 ? 1 : 0);
    return {
      mode: dark ? 'dark' : 'light',
      n1: n1,
      n2: n2,
      n3: n3,
      n4: n4,
      toggle1: () => this.setState({ n1: !n1 }),
      toggle2: () => this.setState({ n2: !n2 }),
      toggle3: () => this.setState({ n3: !n3 }),
      toggle4: () => this.setState({ n4: !n4 }),
      hasAny: count > 0,
      noneSelected: count === 0,
      ctaLabel: 'Tạo ' + count + ' nhóm'
    };
  }
}
</script>
</body>
</html>
