<!doctype html>

<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600&amp;family=Newsreader:wght@400;600&amp;family=Roboto:wght@500&amp;display=swap" rel="stylesheet">
<style>
/* ===== WTG TOKENS v1 — identical in every artboard, do not edit ===== */
body{margin:0}
.wtg{--bg:#F5F2E9;--surface:#FBF9F4;--surface-2:#EDE8DC;--border:#E2DBCC;--border-strong:#8A8072;--text:#1C1917;--muted:#5C554B;--accent:#A8482A;--accent-pressed:#8F3D23;--on-accent:#FFFFFF;--accent-text:#96401F;--accent-soft:#F4E1D7;--success:#2D6E45;--success-bg:#E2EEE2;--warning:#8A5600;--warning-bg:#F5E6C8;--danger:#B3261E;--danger-bg:#F8E0DA;--on-danger:#FFFFFF;--focus:#2F5DA8;--inverse-bg:#1C1917;--inverse-text:#F5F2E9;--inverse-action:#F09D7B;--scrim:rgba(28,25,23,.45);--photo-edge:rgba(28,25,23,.08);--pill:rgba(251,249,244,.92);--dock:rgba(251,249,244,.96);--e1:0 1px 2px rgba(28,25,23,.06);--e2:0 8px 24px -8px rgba(28,25,23,.20);--g-fill:#FFFFFF;--g-stroke:#747775;--g-text:#1F1F1F;--ph-1:#D9C7A7;--ph-2:#C9B8A6;--ph-3:#B9C3AA;--ph-4:#D8B8A4;--ph-5:#C2C9CC;--ph-6:#D3C4A0;--ph-icon:rgba(28,25,23,.32);--viewer-bg:#0C0A09;--sans:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;--serif:'Newsreader',Georgia,'Times New Roman',serif;color-scheme:light;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:24px;-webkit-font-smoothing:antialiased}
.wtg.dark{--bg:#141311;--surface:#1E1C19;--surface-2:#2A2723;--border:#3A3631;--border-strong:#7D7466;--text:#F2EDE3;--muted:#B3AB9C;--accent:#E58A66;--accent-pressed:#CF7652;--on-accent:#1C1210;--accent-text:#F09D7B;--accent-soft:#3B2720;--success:#86CB9A;--success-bg:#1F3326;--warning:#E9B65E;--warning-bg:#3A2E17;--danger:#F49283;--danger-bg:#3E211D;--on-danger:#1C1210;--focus:#93B6F2;--inverse-bg:#F2EDE3;--inverse-text:#1C1917;--inverse-action:#96401F;--scrim:rgba(0,0,0,.60);--photo-edge:rgba(255,255,255,.06);--pill:rgba(30,28,25,.92);--dock:rgba(30,28,25,.96);--e1:none;--e2:0 8px 24px -8px rgba(0,0,0,.70);--g-fill:#131314;--g-stroke:#8E918F;--g-text:#E3E3E3;--ph-1:#4A4033;--ph-2:#463E37;--ph-3:#3D4436;--ph-4:#4D3A31;--ph-5:#3B4145;--ph-6:#48412F;--ph-icon:rgba(255,255,255,.30);color-scheme:dark}
.wtg *{box-sizing:border-box}
.wtg button,.wtg input,.wtg select,.wtg textarea{font:inherit;color:inherit}
.wtg a{color:var(--accent-text);text-decoration:none}
.wtg a:hover{color:var(--accent-text)}
.wtg p a,.wtg li a{text-decoration:underline;text-underline-offset:3px}
.wtg :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.t-display{font-family:var(--serif);font-size:36px;line-height:46px;font-weight:600;letter-spacing:-0.01em;margin:0}
.t-h1{font-family:var(--serif);font-size:28px;line-height:36px;font-weight:600;margin:0}
.t-h2{font-family:var(--serif);font-size:22px;line-height:30px;font-weight:600;margin:0}
.t-name{font-family:var(--serif);font-size:17px;line-height:22px;font-weight:600;margin:0}
.t-name-lg{font-family:var(--serif);font-size:24px;line-height:32px;font-weight:600;margin:0}
.t-numeral{font-family:var(--serif);font-size:28px;line-height:36px;font-weight:600}
.t-story{font-family:var(--serif);font-size:18px;line-height:28px;font-weight:400;margin:0}
.t-title{font-size:17px;line-height:24px;font-weight:600;margin:0}
.t-body{font-size:16px;line-height:24px;font-weight:400;margin:0}
.t-btn{font-size:16px;line-height:24px;font-weight:600}
.t-body-sm{font-size:15px;line-height:22px;font-weight:400;margin:0}
.t-label{font-size:14px;line-height:20px;font-weight:600;margin:0}
.t-caption{font-size:13px;line-height:18px;font-weight:400;margin:0}
.t-micro{font-size:12px;line-height:16px;font-weight:600;white-space:nowrap}
.muted{color:var(--muted)}
/* ===== end WTG TOKENS v1 ===== */
</style>
</helmet>
<div class="wtg {{mode}}" style="width: 390px; height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column; background: var(--bg)">

  <!-- abstract dark map base (decorative) -->

    <div style="position: absolute; left: -40px; top: 150px; width: 480px; height: 5px; background: var(--map-road); transform: rotate(-2deg)"></div>
    <div style="position: absolute; left: -40px; top: 318px; width: 480px; height: 6px; background: var(--map-road); transform: rotate(-4deg)"></div>
    <div style="position: absolute; left: -40px; top: 410px; width: 480px; height: 5px; background: var(--map-road); transform: rotate(3deg)"></div>

    <div style="position: absolute; left: 52px; top: -40px; width: 10px; height: 920px; background: var(--map-road-2); transform: rotate(5deg)"></div>
    <div style="position: absolute; left: 304px; top: -40px; width: 9px; height: 920px; background: var(--map-road-2); transform: rotate(-6deg)"></div>

    <div style="position: absolute; left: 140px; top: 286px; width: 100px; text-align: center; font-size: 12px; line-height: 16px; color: #8A9AA5">Hồ Hoàn Kiếm</div>
  </div>

  <!-- search radius: 1.5px accent line, 6% fill -->
  <div aria-hidden="true" style="position: absolute; left: -80px; top: 185px; width: 460px; height: 460px; border-radius: 999px; border: 1.5px solid var(--accent); pointer-events: none">
    <div style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; border-radius: 999px; background: var(--accent); opacity: .06"></div>
  </div>

  <!-- user location: hollow dot + accuracy halo -->
  <div role="img" aria-label="Vị trí của bạn" style="position: absolute; left: 118px; top: 383px; width: 64px; height: 64px; display: flex; align-items: center; justify-content: center">
    <span style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; border-radius: 999px; background: var(--focus); opacity: .15"></span>
    <span style="position: relative; width: 16px; height: 16px; border-radius: 999px; background: var(--surface); border: 4px solid var(--focus)"></span>
  </div>

  <!-- normal pins -->
  <button type="button" aria-label="Chỗ chơi đã lưu" style="position: absolute; left: 96px; top: 246px; width: 44px; height: 44px; padding: 0; margin: 0; border: 0; background: transparent; display: flex; align-items: center; justify-content: center">
    <span style="width: 20px; height: 20px; border-radius: 999px; background: var(--accent); box-shadow: 0 0 0 2px var(--surface)"></span>
  </button>
  <button type="button" aria-label="Chỗ chơi đã lưu" style="position: absolute; left: 296px; top: 330px; width: 44px; height: 44px; padding: 0; margin: 0; border: 0; background: transparent; display: flex; align-items: center; justify-content: center">
    <span style="width: 20px; height: 20px; border-radius: 999px; background: var(--accent); box-shadow: 0 0 0 2px var(--surface)"></span>
  </button>

  <!-- cluster of 3 -->
  <button type="button" aria-label="3 nơi gần nhau, chạm để phóng to" style="position: absolute; left: 248px; top: 228px; width: 44px; height: 44px; padding: 0; margin: 0; border: 0; background: transparent; display: flex; align-items: center; justify-content: center">
    <span style="width: 40px; height: 40px; border-radius: 999px; background: var(--surface); border: 2px solid var(--accent); box-shadow: var(--e2); display: flex; align-items: center; justify-content: center; font-family: var(--serif); font-size: 18px; line-height: 24px; font-weight: 600; color: var(--text)">3</span>
  </button>

  <!-- selected pin: 28px + 3px surface ring + 2px ink ring -->
  <button type="button" aria-label="Phố đi bộ Hồ Gươm, đang chọn" style="position: absolute; left: 174px; top: 350px; width: 44px; height: 44px; padding: 0; margin: 0; border: 0; background: transparent; display: flex; align-items: center; justify-content: center">
    <span style="width: 28px; height: 28px; border-radius: 999px; background: var(--accent); box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px var(--text)"></span>
  </button>

  <!-- floating top controls -->
  <a href="GanToiHoi.dc.html" aria-label="Quay lại" style="position: absolute; left: 16px; top: 55px; width: 44px; height: 44px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--e2); color: var(--text); display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 512 512" aria-hidden="true" style="display: block; flex: none"><path d="M328 112 184 256l144 144" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="48px"></path></svg></a>
  <div class="t-label" style="position: absolute; left: 68px; top: 55px; height: 44px; padding: 0 16px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--e2); color: var(--text); display: flex; align-items: center; white-space: nowrap">Chỗ chơi · 3 km</div>

  <!-- locate + attribution, riding above the sheet -->
  <button type="button" aria-label="Về vị trí của tôi" style="position: absolute; right: 16px; bottom: 344px; width: 44px; height: 44px; padding: 0; margin: 0; border-radius: 999px; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--e2); color: var(--text); display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 512 512" aria-hidden="true" style="display: block; flex: none"><path d="M256 96V56M256 456v-40" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="48px"></path><path d="M256 112a144 144 0 1 0 144 144 144 144 0 0 0-144-144Z" fill="none" stroke="currentColor" stroke-miterlimit="10" stroke-width="32px"></path><path d="M416 256h40M56 256h40" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="48px"></path></svg></button>
  <div style="position: absolute; left: 16px; bottom: 352px; height: 28px; padding: 0 10px; border-radius: 999px; background: var(--pill); color: var(--muted); font-size: 12px; line-height: 16px; display: flex; align-items: center; white-space: nowrap">© OpenFreeMap © OpenStreetMap</div>

  <!-- info sheet -->
  <section aria-label="Thông tin địa điểm" style="position: absolute; left: 0; right: 0; bottom: 0; height: 332px; background: var(--surface); border-radius: 24px 24px 0 0; border-top: 1px solid var(--border); box-shadow: var(--e2); padding: 8px 16px 34px; display: flex; flex-direction: column">
    <div style="width: 36px; height: 5px; border-radius: 999px; background: var(--border-strong); margin: 0 auto; flex: none"></div>

    <div style="margin-top: 7px; height: 44px; flex: none; display: flex; align-items: center">
      <span class="t-micro" style="height: 28px; padding: 0 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-text); display: inline-flex; align-items: center; gap: 4px"><svg width="16" height="16" viewBox="0 0 512 512" aria-hidden="true" style="display: block; flex: none"><path d="M467.51 248.83c-18.4-83.18-45.69-136.24-89.43-149.17A91.5 91.5 0 0 0 352 96c-26.89 0-48.11 16-96 16s-69.15-16-96-16a99 99 0 0 0-27.2 3.66C89 112.59 61.94 165.7 43.33 248.83c-19 84.91-15.56 152 21.58 164.88 26 9 49.25-9.61 71.27-37 25-31.2 55.79-40.8 119.82-40.8s93.62 9.6 118.66 40.8c22 27.41 46.11 45.79 71.42 37.16 41.02-14.01 40.44-79.13 21.43-165.04Z" fill="none" stroke="currentColor" stroke-miterlimit="10" stroke-width="32px"></path><circle cx="292" cy="224" r="20"></circle><path d="M336 288a20 20 0 1 1 20-19.95A20 20 0 0 1 336 288"></path><circle cx="336" cy="180" r="20"></circle><circle cx="380" cy="224" r="20"></circle><path d="M160 176v96M208 224h-96" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="32px"></path></svg>Chỗ chơi</span>

      <button type="button" aria-label="Đóng" style="width: 44px; height: 44px; padding: 0; border: 0; background: transparent; border-radius: 999px; color: var(--text); display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 512 512" aria-hidden="true" style="display: block; flex: none"><path d="M368 368 144 144M368 144 144 368" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="32px"></path></svg></button>
    </div>

    <div style="margin-top: 8px; flex: none; display: flex; gap: 12px; align-items: center">
      <div role="img" aria-label="Ảnh minh hoạ: Phố đi bộ Hồ Gươm" style="width: 148px; aspect-ratio: 16 / 10; flex: none; border-radius: 12px; background: var(--ph-5); box-shadow: inset 0 0 0 1px var(--photo-edge); display: flex; align-items: center; justify-content: center; color: var(--ph-icon)"><svg width="28" height="28" viewBox="0 0 512 512" aria-hidden="true" style="display: block; flex: none"><rect width="416" height="352" x="48" y="80" rx="48" ry="48" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-width="32px"></rect><circle cx="336" cy="176" r="32" fill="none" stroke="currentColor" stroke-miterlimit="10" stroke-width="32px"></circle><path d="m304 335.79-90.66-90.49a32 32 0 0 0-43.87-1.3L48 352M224 432l123.34-123.34a32 32 0 0 1 43.11-2L464 368" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="32px"></path></svg></div>
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
        <h2 class="t-name-lg">Phố đi bộ Hồ Gươm</h2>
        <p class="t-body-sm muted">Miễn phí · cách bạn 0,8 km</p>
      </div>
    </div>

    <div style="margin-top: 16px; flex: none; display: flex; gap: 10px; align-items: flex-start">
      <span style="color: var(--muted); padding-top: 1px; display: flex"><svg width="20" height="20" viewBox="0 0 512 512" aria-hidden="true" style="display: block; flex: none"><path d="M256 64C150 64 64 150 64 256s86 192 192 192 192-86 192-192S362 64 256 64Z" fill="none" stroke="currentColor" stroke-miterlimit="10" stroke-width="32px"></path><path d="M256 128v144h96" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="32px"></path></svg></span>
      <div style="display: flex; flex-direction: column">
        <p class="t-body-sm" style="color: var(--success); font-weight: 600">Đang mở</p>
        <p class="t-caption muted">T6 19:00–24:00, T7–CN cả ngày</p>
      </div>
    </div>

    <div style="margin-top: auto; flex: none; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <button type="button" class="t-btn" style="height: 48px; padding: 0 20px; border-radius: 12px; background: var(--accent); color: var(--on-accent); border: 0; display: inline-flex; align-items: center; justify-content: center; gap: 8px"><svg width="20" height="20" viewBox="0 0 512 512" aria-hidden="true" style="display: block; flex: none"><path d="M448 64 64 240.14h200a8 8 0 0 1 8 8V448Z" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="32px"></path></svg>Chỉ đường</button>
      <a href="ChiTiet.dc.html" class="t-btn" style="height: 48px; padding: 0 20px; border-radius: 12px; background: var(--surface); color: var(--text); border: 1px solid var(--border-strong); display: inline-flex; align-items: center; justify-content: center; gap: 8px">Xem đầy đủ</a>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true,"section":"Giao diện"},"$preview":{"width":390,"height":844}}'>

  renderVals() {
    return { mode: (this.props.dark ?? true) ? 'dark' : 'light' };
  }
}
</script>
